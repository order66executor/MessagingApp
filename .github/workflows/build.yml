on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        project:
          - name: Client
            path: src/Messaging.UI/Messaging.UI.csproj
          - name: Server
            path: src/Messaging.Server/Messaging.Server.csproj

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish ${{ matrix.project.name }}
        run: |
            dotnet publish \
            ${{ matrix.project.path }} \
            -c Release \
            -o ./publish/${{ matrix.project.name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish/
          
      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "publish/Server/*"
          target: "/opt/deploy/"

